name: fun_kits
description: A Fun Kits app for Exhibitors - gamified exhibition experience.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6

  # State Management
  provider: ^6.1.1

  # UI & Animations
  animate_do: ^3.3.4
  flutter_spinkit: ^5.2.0
  confetti: ^0.7.0
  lottie: ^3.0.0
  flutter_colorpicker: ^1.0.3

  # Image
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # Utils
  uuid: ^4.3.3
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

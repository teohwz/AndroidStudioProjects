name: fun_kits
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0

  # State Management
  provider: ^6.1.1

  # UI & Animations
  animate_do: ^5.1.0
  flutter_spinkit: ^5.2.0
  confetti: ^0.8.0
  lottie: ^3.0.0
 
  # Google Sign-In
  google_sign_in: ^7.2.0

  # Utils
  cached_network_image: ^3.4.1
  image_picker: ^1.0.7
  uuid: ^4.3.3
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  flutter_colorpicker: ^1.0.3

  # QR code access
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Charts (My Stats / Exhibitor Analytics)
  fl_chart: ^0.69.0

  # Share/print exported files (e.g. exhibitor's booth QR code image)
  share_plus: ^10.1.4
  # Save exported images directly to the device's photo gallery — the OS
  # share sheet above has no reliable "save to gallery" destination on
  # Android, so a real save needs this dedicated native API instead.
  gal: ^2.3.0

  # New "wow" mini-games — animated prize wheel and scratch-to-reveal card
  flutter_fortune_wheel: ^1.3.2
  scratcher: ^2.5.0

  # Opens the exhibitor's Facebook/Instagram/Website links from the
  # "Follow the Exhibitor" booth task
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
